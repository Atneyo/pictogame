server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's embedded DNS: names are looked up again every 10 seconds
    resolver 127.0.0.11 valid=10s;

    # API: forward to the Spring Boot container (same role as the Vite dev proxy)
    location /api/ {
        # Using a variable forces nginx to resolve the name at request time
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name: they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any unknown path returns index.html and React Router picks the page.
    # Without this, refreshing /dictation would give a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}