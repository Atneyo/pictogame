spring:
  application:
    name: pictogame
  profiles:
    default: dev

  datasource:
    # Surchargeables par variables d'environnement (utile pour Docker et la prod)
    url: ${DB_URL:jdbc:mysql://localhost:3306/pictogame?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:pictogame}
    password: ${DB_PASSWORD:pictogame}

  jpa:
    hibernate:
      # Flyway crée le schéma ; Hibernate vérifie seulement qu'il correspond aux entités
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080