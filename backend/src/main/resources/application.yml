spring:
  application:
    name: pictogame
  profiles:
    default: dev

  datasource:
    # Can be overridden by environment variables (useful for Docker and production)
    url: ${DB_URL:jdbc:mysql://localhost:3306/pictogame?allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:pictogame}
    password: ${DB_PASSWORD:pictogame}

  jpa:
    hibernate:
      # Flyway creates the schema; Hibernate only checks that it matches the entities
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080